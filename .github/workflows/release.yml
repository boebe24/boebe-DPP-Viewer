name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump from the latest release"
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      dry_run:
        description: "Dry run: build and verify, but create no release"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish the release APK
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: "temurin"
          # Must match toolchainVersion in gradle/gradle-daemon-jvm.properties, the JDK is an input
          # of the build output. Robolectric caps this at 25, its ASM cannot read Java 26 bytecode.
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # A published artifact must not be built from a restored cache.
          cache-disabled: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      # The base version is taken from the releases as well as the tags. A draft release has no
      # git tag yet, so looking at tags alone would recompute a version that is already taken and
      # only fail later, at `gh release create`.
      - name: Compute version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Fetched separately so that an API error fails the run here, instead of quietly
          # lowering the base version to what the tags alone know about.
          releases="$(gh release list --limit 100 --json tagName --jq '.[].tagName')"

          # grep exits 1 when there is nothing to release from yet, hence the fallback.
          base="$(
            {
              git tag --list 'v[0-9]*'
              printf '%s\n' "$releases"
            } | sed 's/^v//' | grep -E '^[0-9]+(\.[0-9]+){0,2}$' | sort -V | tail -n1 || true
          )"
          base="${base:-0.0.0}"

          # A shorter tag such as v1.0 leaves the missing components empty, and 10# keeps a
          # component such as 08 from being read as an invalid octal number.
          IFS=. read -r major minor patch <<<"$base"
          major="$((10#${major:-0}))" minor="$((10#${minor:-0}))" patch="$((10#${patch:-0}))"
          case "$BUMP" in
            major) version="$((major + 1)).0.0" ;;
            minor) version="${major}.$((minor + 1)).0" ;;
            patch) version="${major}.${minor}.$((patch + 1))" ;;
            *) echo "::error::Unknown bump level $BUMP"; exit 1 ;;
          esac

          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null \
            || grep -qxF "v$version" <<<"$releases"; then
            echo "::error::v$version already exists as a tag or release"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Bumping v$base to v$version ($BUMP)" >> "$GITHUB_STEP_SUMMARY"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set, refusing to publish a debug signed APK"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keystore.jks"

      # Two identical builds must produce the same APK. If they do not, something in the build
      # depends on time, paths or ordering, and the published checksum would be meaningless.
      - name: Build release APK
        env:
          DPP_KEYSTORE_FILE: ${{ runner.temp }}/keystore.jks
          DPP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          DPP_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          DPP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ./gradlew assembleRelease -Pdpp.versionName="$VERSION"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/first.apk"

      - name: Rebuild release APK from a clean tree
        env:
          DPP_KEYSTORE_FILE: ${{ runner.temp }}/keystore.jks
          DPP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          DPP_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          DPP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ./gradlew clean
          ./gradlew assembleRelease -Pdpp.versionName="$VERSION"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/second.apk"

      # The APK bytes cannot be compared directly. With minSdk 33 apksigner signs with RSASSA-PSS,
      # whose salt is random, so the signing block differs on every build even for identical input.
      # What must be stable is everything inside the archive, so the entries are compared instead.
      - name: Verify both builds produce the same APK contents
        id: repro
        run: |
          set -euo pipefail
          content_hash() {
            local extracted="$RUNNER_TEMP/extracted-$2"
            mkdir -p "$extracted"
            unzip -q -o "$1" -d "$extracted"
            ( cd "$extracted" && find . -type f -print0 | sort -z | xargs -0 sha256sum ) \
              | sha256sum | cut -d' ' -f1
          }

          first="$(content_hash "$RUNNER_TEMP/first.apk" first)"
          second="$(content_hash "$RUNNER_TEMP/second.apk" second)"
          echo "first  $first"
          echo "second $second"
          if [ "$first" != "$second" ]; then
            echo "::error::The release build is not reproducible, the two APKs differ in content"
            exit 1
          fi
          echo "content_hash=$first" >> "$GITHUB_OUTPUT"

      - name: Collect release files
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CONTENT_HASH: ${{ steps.repro.outputs.content_hash }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp "$RUNNER_TEMP/first.apk" "artifacts/dpp-viewer-$VERSION.apk"
          cd artifacts
          sha256sum ./*.apk > SHA256SUMS.txt
          {
            if [ "$DRY_RUN" = "true" ]; then
              echo "## Release candidate v$VERSION"
            else
              echo "## Release v$VERSION"
            fi
            echo
            echo "Built twice from a clean tree, both builds had identical APK contents."
            echo
            echo '```'
            cat SHA256SUMS.txt
            echo "$CONTENT_HASH  APK contents (signature excluded)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release candidate
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-v${{ steps.version.outputs.version }}
          path: artifacts/

      # The draft records the tag name, the git tag itself is created by GitHub once the draft is
      # published. --target pins it to the commit this run built.
      - name: Create draft release
        if: ${{ ! inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.version.outputs.version }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --draft \
            --target "$GITHUB_SHA" \
            --generate-notes \
            --title "$TAG" \
            "artifacts/dpp-viewer-$VERSION.apk" \
            "artifacts/SHA256SUMS.txt"
